<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tecnobro | Acceso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
        .card { background: #1e1e1e; color: white; border-top: 5px solid #e63946; width: 350px; padding: 30px; border-radius: 15px; }
        input { background: #2d2d2d !important; border: 1px solid #444 !important; color: white !important; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card text-center shadow-lg">
        <h2 class="fw-bold mb-4">TECNO<span style="color:#e63946">BRO</span></h2>
        <input type="text" id="loginUser" class="form-control" placeholder="Usuario">
        <input type="password" id="loginPass" class="form-control" placeholder="Contraseña">
        <button class="btn btn-danger w-100 fw-bold" onclick="ingresar()">INGRESAR</button>
    </div>
    <script src="login.js"></script>
</body>
</html>
